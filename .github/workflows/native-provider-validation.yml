name: Native provider validation
on:
  push:
    branches: [validation/native-mediarium]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Static checks, unit tests, phone and TV builds
        run: >-
          ./gradlew spotlessCheck detekt
          :shared-network:jvmTest :shared-core:testDebugUnitTest
          :design:testDebugUnitTest :design-tv:testDebugUnitTest
          :app-android:assembleDebug :app-tv:assembleDebug --stacktrace
      - name: Validate screenshot baselines
        run: ./gradlew :design-screenshots:validateDebugScreenshotTest :design-tv-screenshots:validateDebugScreenshotTest --stacktrace
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-provider-validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
